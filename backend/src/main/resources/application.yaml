spring:
  application:
    name: chatapp
  datasource:
    url: jdbc:mysql://localhost:3336/chat?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: chatuser
    password: 
  flyway:
    enabled: true
    locations: classpath:db/migration

  jpa:
    database-platform: org.hibernate.dialect.MySQLDialect
    hibernate:
      ddl-auto: none
    show-sql: false
jwt:
  private-key: classpath:jwt/app.key
  public-key: classpath:jwt/app.pub
  ttl: 15m
  refresh-expiration-ms: 86400000 # 1h